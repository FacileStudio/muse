[tools]
bun = "latest"

[tasks.check]
description = "Type-check every component and util (svelte-check)"
# The demo install is not optional: tsconfig covers demo/src, and svelte-check
# reads demo/svelte.config.js, which imports a demo devDependency. On a fresh
# clone, skipping it fails with one ERR_MODULE_NOT_FOUND per demo file.
run = [
    "bun install",
    "bun install --cwd demo",
    "bunx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings",
]

[tasks.test]
description = "Run the chart and secret maths checks"
run = "bun test src/lib"

[tasks.demo]
description = "Run the muse demo app (http://127.0.0.1:5183)"
dir = "demo"
run = "bun install && bun run dev"

[tasks."demo:build"]
description = "Production build of the demo app — compiles every component"
dir = "demo"
run = "bun install && bun run build"

[tasks."check:site"]
description = "Type-check the docs site (its own tsconfig — it needs SvelteKit's $app and $lib aliases)"
dir = "site"
run = ["bun install", "bun run check"]

[tasks."site:build"]
description = "Production build of muse.facile.studio"
dir = "site"
run = ["bun install", "bun run build"]

[tasks.smoke]
description = "Consumer contract: install the packed package into a SvelteKit app, dev + build + SSR"
# The demo aliases the source, so it cannot see the exports map, the dependency optimizer,
# SSR, or a real node_modules layout. This can. See scripts/smoke.sh.
run = "sh ./scripts/smoke.sh"

[tasks.verify]
description = "Everything CI would run: types (lib + site), tests, demo and site builds, consumer smoke"
depends = ["check", "check:site", "test", "demo:build", "site:build", "smoke"]

[tasks.release]
description = "Cut a release: verify, bump, commit, tag, push — mise run release 0.4.0"
# The git tag IS the distribution (consumers pin github:FacileStudio/muse#vX.Y.Z), so a
# pushed tag cannot be taken back. See scripts/release.sh for the guards.
run = "sh ./scripts/release.sh"
