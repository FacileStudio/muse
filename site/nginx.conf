server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # adapter-static emits `principes.html`, not `principes/index.html`. Without the `$uri.html`
    # arm every deep link 404s in production while `vite preview` stays green, because the dev
    # preview resolves extensionless paths itself. This is the trailing-slash trap.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # The machine-readable corpus. Served as UTF-8 text so an agent fetching /llms.txt or a
    # page's .md twin gets something readable rather than a download prompt.
    location ~ \.(md|txt)$ {
        default_type text/plain;
        charset utf-8;
    }

    # Hashed assets are immutable; pages are not. Getting this backwards is how a deploy ships
    # and nobody sees it for a day.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
