name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # svelte-check reads demo/svelte.config.js, which imports
      # @sveltejs/vite-plugin-svelte — a demo devDependency. Without this the
      # type-check fails to resolve it and reports an error per demo file.
      - name: Install demo
        run: bun install --cwd demo

      - name: Type-check every component
        run: bunx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings

      - name: Unit tests
        run: bun test src/lib

      - name: Build the demo
        working-directory: demo
        run: bun run build
